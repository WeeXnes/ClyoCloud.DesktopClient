version: 53
jobs:
- name: Build & Package Desktop Installers
  jobExecutor: Builder
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Install Node Dependencies
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Installing Node.js dependencies..."
      npm install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Compile App Bundle
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Compiling TypeScript and bundling renderer assets..."
      npm run build
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Package App Binaries (Linux & Windows)
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Packaging unpacked Electron applications for Linux and Windows..."
      npm run pack:linux
      npm run pack:win
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Setup Installer Framework
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Initializing InstallerFramework from https://code.weexnes.dev/InstallerFramework.git..."
      chmod +x installer/*.sh
      ./installer/setup.sh
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Build Standalone Installers
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Compiling standalone single-file installer wizards..."
      ./installer/build.sh all
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: Extract Version
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: sh
    commands: |
      echo "Extracting version from package.json..."
      grep -oP '"version":\s*"\K[^"]+' package.json > version.txt
      version=$(cat version.txt)
      echo "Version extracted: $version"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Publish Installers & Artifacts
    artifacts: installer/publish/**,version.txt
    condition: SUCCESSFUL
    optional: false
  - type: SetBuildVersionStep
    name: Set Build Version
    buildVersion: '@file:version.txt@'
    condition: ALWAYS
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 14400
